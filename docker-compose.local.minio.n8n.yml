services:
  tts:
    container_name: openai-edge-tts
    restart: unless-stopped
    build:
      context: openai-edge-tts
      args:
        INSTALL_FFMPEG: ${INSTALL_FFMPEG_ARG:-false} # Controlled by env var or defaults to false
    ports:
      - "${PORT:-5050}:5050"
    env_file:
      - openai-edge-tts/.env
    environment: # optionally define in -e argument when running docker command
      API_KEY: ${API_KEY:-your_api_key_here}
      PORT: ${PORT:-5050}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-en-US-AvaNeural}
      DEFAULT_RESPONSE_FORMAT: ${DEFAULT_RESPONSE_FORMAT:-mp3}
      DEFAULT_SPEED: ${DEFAULT_SPEED:-1.0}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en-US}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-True}
      REMOVE_FILTER: ${REMOVE_FILTER:-False}
      EXPAND_API: ${EXPAND_API:-True}
      DETAILED_ERROR_LOGGING: ${DETAILED_ERROR_LOGGING:-True}

  ncat:
    build: .
    env_file:
      - .env.local.minio.n8n
    ports:
      - "8080:8080"
    volumes:
      - storage:/app/storage
      - logs:/app/logs
    restart: unless-stopped
    depends_on:
      - minio
      - minio-init
    networks:
      - nca-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - nca-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/nca-toolkit-local --ignore-existing;
      /usr/bin/mc anonymous set public myminio/nca-toolkit-local;
      echo 'MinIO bucket nca-toolkit-local created and configured as public';
      "
    networks:
      - nca-network

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks:
      - nca-network

volumes:
  storage:
    driver: local
  logs:
    driver: local
  minio_data:
    driver: local
  n8n_data:
    driver: local

networks:
  nca-network:
    driver: bridge
